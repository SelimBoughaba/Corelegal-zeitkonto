<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1E1D1D" />
    <script>
      // Palette und Hell/Dunkel vor dem ersten Zeichnen setzen (kein Aufblitzen)
      try {
        var s = (JSON.parse(localStorage.getItem('corelegal-zeiten.v1') || '{}').settings) || {}
        var ap = s.appearance || 'auto'
        var dark = ap === 'dark' || (ap === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.mode = dark ? 'dark' : 'light'
        document.documentElement.dataset.theme = s.theme || 'americano'
      } catch (e) {
        document.documentElement.dataset.mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Zeiten" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <title>Zeiten</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
